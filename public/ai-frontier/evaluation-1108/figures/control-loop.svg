<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc"><title id="title">控制、观测与评分的信号关系</title><desc id="desc">无箭头连线示意。控制器施加三路力于受扰对象；对象输出真实速度。真实速度分送评分和加噪观测，控制器读取观测并结合自身历史。</desc><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#242520;font-size:17px}.muted{fill:#626258}.accent{fill:#b74736}.small{font-size:15px}.label{font-weight:600}.line{fill:none;stroke:#626258;stroke-width:2}.box{fill:#f6f2e8;stroke:#626258;stroke-width:1.5}</style><rect width="720" height="430" rx="16" fill="#f6f2e8"/><path class="line" d="M200 213H270 M460 213H530 M365 105V165 M607 105V165 M607 245V330 M485 363H117V265"/><rect class="box" x="35" y="165" width="165" height="100" rx="9"/><text x="117" y="199" text-anchor="middle" class="label">控制器</text><text x="117" y="230" text-anchor="middle" class="small">当前观测与历史</text><rect class="box" x="270" y="165" width="190" height="100" rx="9"/><text x="365" y="199" text-anchor="middle" class="label">耦合动力学对象</text><text x="365" y="230" text-anchor="middle" class="small">10 状态 · 3 路输入</text><rect class="box" x="530" y="165" width="155" height="80" rx="9"/><text x="607" y="198" text-anchor="middle" class="label">真实速度</text><text x="607" y="225" text-anchor="middle" class="small">三路输出</text><rect class="box" x="270" y="30" width="190" height="75" rx="9"/><text x="365" y="61" text-anchor="middle" class="label">H / V 两路扰动</text><text x="365" y="86" text-anchor="middle" class="small">作用于对象</text><rect class="box" x="530" y="30" width="155" height="75" rx="9"/><text x="607" y="61" text-anchor="middle" class="label">评分</text><text x="607" y="86" text-anchor="middle" class="small">取三路真值</text><rect class="box" x="485" y="330" width="200" height="65" rx="9"/><text x="585" y="357" text-anchor="middle" class="small">真实速度 + 观测噪声</text><text x="585" y="382" text-anchor="middle" class="small">形成含噪观测</text><text x="235" y="145" text-anchor="middle" class="accent small">施加力</text><text x="235" y="294" text-anchor="middle" class="small">每路 ±0.5 N</text><text x="495" y="145" text-anchor="middle" class="small">输出</text><text x="300" y="350" text-anchor="middle" class="accent small">控制器读取含噪观测</text><text x="360" y="418" text-anchor="middle" class="muted small">每轮 10 kHz · 持续 1000 秒</text></svg>
