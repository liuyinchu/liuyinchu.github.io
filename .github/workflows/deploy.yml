name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '37 4,10 * * 2-6'

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Refresh VIX closing data
        run: |
          git fetch --no-tags --depth=1 --filter=blob:none origin gh-pages
          if git cat-file -e FETCH_HEAD:data/vix-latest.json 2>/dev/null; then
            git show FETCH_HEAD:data/vix-latest.json | node scripts/update-vix-snapshot.mjs --previous-stdin
          else
            node scripts/update-vix-snapshot.mjs
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: liuyinchu
          user_email: liuyinchu@users.noreply.github.com
          commit_message: Deploy ${{ github.sha }}
