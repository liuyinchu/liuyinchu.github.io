<svg xmlns="http://www.w3.org/2000/svg" width="360" height="680" viewBox="0 0 360 680" role="img" aria-labelledby="t d"><title id="t">控制、观测与评分</title><desc id="d">控制器施加三路力，受扰对象产生真实速度。真值用于评分，加噪后的观测反馈给控制器。</desc><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#242520;font-size:18px}.small{font-size:16px}.muted{fill:#626258}.line{fill:none;stroke:#626258;stroke-width:1.7}.box{fill:#f6f2e8;stroke:#aaa798;stroke-width:1.2}</style><rect width="360" height="680" rx="12" fill="#f6f2e8"/><path class="line" d="M218 108V192 M92 240H108 M218 288V360 M92 398H108 M218 436V508 M328 556H350V70H328"/><rect class="box" x="108" y="32" width="220" height="76" rx="8"/><text x="218" y="62" text-anchor="middle" font-weight="600">控制器</text><text class="small" x="218" y="88" text-anchor="middle">当前观测与历史</text><text class="small" x="218" y="154" text-anchor="middle">3 路力 · 每路 ±0.5 N</text><rect class="box" x="108" y="192" width="220" height="96" rx="8"/><text x="218" y="228" text-anchor="middle" font-weight="600">耦合动力学对象</text><text class="small" x="218" y="258" text-anchor="middle">10 状态 · 3 路输入</text><rect class="box" x="8" y="192" width="84" height="96" rx="8"/><text x="50" y="228" text-anchor="middle">H / V</text><text x="50" y="258" text-anchor="middle">扰动</text><text class="small" x="218" y="331" text-anchor="middle">对象响应</text><rect class="box" x="108" y="360" width="220" height="76" rx="8"/><text x="218" y="405" text-anchor="middle" font-weight="600">三路真实速度</text><rect class="box" x="8" y="360" width="84" height="76" rx="8"/><text x="50" y="390" text-anchor="middle">逐步</text><text x="50" y="415" text-anchor="middle">评分</text><rect class="box" x="108" y="508" width="220" height="96" rx="8"/><text class="small" x="218" y="542" text-anchor="middle">真实速度 + 观测噪声</text><text x="218" y="575" text-anchor="middle" font-weight="600">形成含噪观测</text><text class="small muted" x="180" y="646" text-anchor="middle">控制器读取含噪观测，继续下一步</text></svg>